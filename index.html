<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soporte TI - AR</title>

  <!-- 1) A-Frame: el "motor" 3D que dibuja los objetos -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- 2) MindAR: reconoce la imagen impresa y "pega" los objetos encima -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #aviso {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 16px;
      border-radius: 20px; font-size: 15px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="aviso">Apunta la cámara a la etiqueta de Soporte TI</div>

  <!-- 3) La escena AR. "targets.mind" es el archivo que tú vas a generar
          a partir de la imagen marcador-ti.png -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; uiLoading: yes"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 4) Todo lo que esté dentro de este "target" aparece sobre la etiqueta.
            Medidas: 1 = el ancho de la etiqueta impresa. -->
    <a-entity id="etiqueta" mindar-image-target="targetIndex: 0">

      <!-- Marco verde para confirmar que reconoció la etiqueta -->
      <a-plane width="1.02" height="1.02" color="#00c853" opacity="0.25"></a-plane>

      <!-- Un "CPU" hecho con cajas simples (después lo cambiamos por tu modelo de Blender) -->
      <a-entity position="0 0 0.35"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-box width="0.3" height="0.6" depth="0.55" color="#3a3f47"></a-box>           <!-- gabinete -->
        <a-box width="0.31" height="0.55" depth="0.02" position="0 0 0.28" color="#1c1f24"></a-box> <!-- frente -->
        <a-cylinder radius="0.035" height="0.02" rotation="90 0 0" position="0 0.18 0.3"
                    color="#00e5ff"
                    animation="property: material.opacity; from: 1; to: 0.3; dir: alternate; loop: true; dur: 700"
                    material="transparent: true"></a-cylinder>                            <!-- botón encendido -->
        <a-box width="0.02" height="0.02" depth="0.01" position="0.09 0.18 0.3" color="#76ff03"></a-box> <!-- LED -->
      </a-entity>

      <!-- Texto flotante con la instrucción -->
      <a-text value="Si no responde:\nmanten el boton 5 seg"
              align="center" color="#ffffff" width="1.6"
              position="0 -0.62 0.05"></a-text>
      <a-plane width="1" height="0.22" color="#d32f2f" position="0 -0.62 0.04"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    // 5) Un poquito de lógica: cambiar el aviso cuando encuentra / pierde la etiqueta
    const etiqueta = document.querySelector('#etiqueta');
    const aviso = document.querySelector('#aviso');
    etiqueta.addEventListener('targetFound', () => aviso.textContent = '✅ Etiqueta reconocida');
    etiqueta.addEventListener('targetLost',  () => aviso.textContent = 'Apunta la cámara a la etiqueta de Soporte TI');
  </script>
</body>
</html>
